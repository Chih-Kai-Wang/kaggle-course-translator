<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaggle 課程翻譯助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../icons/icon-48.png" alt="Logo" width="24" height="24">
      <div>
        <h1>Kaggle 課程翻譯</h1>
        <p id="model-badge" class="sub">載入中...</p>
      </div>
    </div>
    <label class="switch" title="啟用或暫停擴充功能">
      <input type="checkbox" id="toggle-enabled">
      <span class="slider"></span>
    </label>
  </header>

  <div id="api-alert" class="alert hidden">
    <span>尚未填寫大模型 API Key，無法發起翻譯。</span>
    <button id="btn-go-config" class="link-btn" type="button">立即設定</button>
  </div>

  <section class="card">
    <div class="row-label">目標語言</div>
    <select id="lang-select" class="select-input"></select>
    <input id="custom-lang-input" class="text-input hidden" type="text" placeholder="請輸入語言名稱，例如：Thai 或 粵語">

    <div class="row-label">顯示模式（原版乾淨排版）</div>
    <div class="segmented" id="mode-group">
      <button type="button" data-mode="replace">譯文</button>
      <button type="button" data-mode="original">僅原文</button>
      <button type="button" data-mode="bilingual">簡潔雙語</button>
    </div>

    <div class="row-label">翻譯範圍</div>
    <div class="segmented" id="scope-group">
      <button type="button" data-scope="course">課程與實作 Notebook</button>
      <button type="button" data-scope="all">整頁可讀文字</button>
    </div>

    <div class="toggles">
      <label class="check-row">
        <input type="checkbox" id="toggle-code-comments">
        <span>翻譯程式碼中的 <code>#</code> 註解</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="toggle-auto">
        <span>開啟 Kaggle 頁面時自動翻譯</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="toggle-selection">
        <span>劃詞翻譯（選取錯誤訊息或提示即可翻譯）</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="toggle-output-btn">
        <span>Notebook 輸出旁顯示「譯」按鈕 (Hint/報錯)</span>
      </label>
      <label class="check-row">
        <input type="checkbox" id="toggle-ball">
        <span>顯示頁面右下角懸浮切換列</span>
      </label>
    </div>
  </section>

  <section class="actions">
    <button id="btn-translate-now" class="btn primary" type="button">立即翻譯目前頁面（含內嵌 Notebook）</button>
    <div class="action-row">
      <button id="btn-retranslate" class="btn secondary" type="button">強制重譯</button>
      <button id="btn-clear-page" class="btn secondary" type="button">還原頁面</button>
    </div>
  </section>

  <footer class="footer">
    <span id="status-text" class="status">就緒</span>
    <button id="btn-open-options" class="link-btn" type="button">模型與 API 設定 ↗</button>
  </footer>

  <script src="../shared/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
