<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaggle 課程智慧翻譯助手 — 設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <img src="../icons/icon-128.png" alt="Logo" width="44" height="44">
      <div>
        <h1>Kaggle 課程智慧翻譯助手設定</h1>
        <p>設定翻譯目標語言、大模型 API、術語表與本機快取；API Key 僅儲存於您本機瀏覽器的 <code>chrome.storage.local</code> 中。</p>
      </div>
    </header>

    <section class="panel">
      <h2>1. 翻譯語言與顯示偏好</h2>

      <div class="grid-2">
        <div class="field">
          <label for="lang-select">目標翻譯語言</label>
          <select id="lang-select"></select>
        </div>
        <div class="field">
          <label for="mode-select">預設顯示模式</label>
          <select id="mode-select">
            <option value="replace">譯文（保持原版乾淨排版，推薦）</option>
            <option value="original">僅原文</option>
            <option value="bilingual">簡潔雙語對照</option>
          </select>
        </div>
      </div>

      <div id="custom-lang-wrap" class="field hidden">
        <label for="custom-lang-input">自訂目標語言名稱</label>
        <input id="custom-lang-input" type="text" placeholder="例如：Traditional Chinese (Hong Kong), Thai, Indonesian">
      </div>

      <div class="field">
        <label class="inline-check">
          <input id="translate-code-comments" type="checkbox">
          <span>自動翻譯課程範例與 Notebook 程式碼中的 Python <code>#</code> 註解</span>
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>2. 大模型 API 設定</h2>

      <div class="field">
        <label for="provider-select">服務商預設</label>
        <select id="provider-select"></select>
        <p id="provider-hint" class="hint"></p>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="protocol-select">介面協定</label>
          <select id="protocol-select">
            <option value="openai">OpenAI 相容 (/chat/completions)</option>
            <option value="gemini">Google Gemini 原生 (:generateContent)</option>
          </select>
        </div>
        <div class="field">
          <label for="model-input">模型名稱 (Model)</label>
          <input id="model-input" type="text" list="model-suggestions" placeholder="例如 gemini-3.5-flash-lite">
          <datalist id="model-suggestions"></datalist>
        </div>
      </div>

      <div class="field">
        <label for="baseurl-input">API Base URL</label>
        <input id="baseurl-input" type="url" placeholder="https://api.deepseek.com/v1">
        <p class="hint">實際請求位址：<code id="endpoint-preview"></code></p>
      </div>

      <div class="field">
        <label for="apikey-input">API Key</label>
        <div class="input-with-btn">
          <input id="apikey-input" type="password" autocomplete="off" placeholder="sk-...">
          <button id="btn-toggle-key" type="button" class="btn secondary">顯示</button>
        </div>
      </div>

      <div class="btn-row">
        <button id="btn-save" type="button" class="btn primary">儲存設定</button>
        <button id="btn-test" type="button" class="btn secondary">測試連線</button>
        <span id="save-status" class="inline-status"></span>
      </div>
      <div id="test-result" class="test-box hidden"></div>
    </section>

    <section class="panel">
      <h2>3. 機器學習術語表與翻譯參數</h2>

      <div class="grid-2">
        <div class="field">
          <label for="batch-size">每批最大段落數 (預設 16)</label>
          <input id="batch-size" type="number" min="1" max="30" step="1">
        </div>
        <div class="field">
          <label for="temperature-input">溫度 Temperature (建議 0.1 - 0.3)</label>
          <input id="temperature-input" type="number" min="0" max="1" step="0.1">
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="glossary-input">自訂術語表（每行一筆，格式：英文 -> 譯詞）</label>
          <button id="btn-reset-glossary" type="button" class="link-btn">恢復預設繁中術語表</button>
        </div>
        <textarea id="glossary-input" rows="8"></textarea>
      </div>

      <div class="btn-row">
        <button id="btn-save-bottom" type="button" class="btn primary">儲存全部設定</button>
        <span id="save-status-bottom" class="inline-status"></span>
      </div>
    </section>

    <section class="panel">
      <h2>4. 本機翻譯快取</h2>
      <p class="hint">已翻譯過的課程段落與程式碼註解會依「模型＋目標語言」自動快取於本機，下次開啟無須重複呼叫 API。</p>
      <div class="cache-bar">
        <span id="cache-stats">正在統計快取...</span>
        <button id="btn-clear-cache" type="button" class="btn danger-outline">清空全部快取</button>
      </div>
    </section>
  </main>

  <script src="../shared/config.js"></script>
  <script src="options.js"></script>
</body>
</html>
